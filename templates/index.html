<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EwhaMarket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="navbar__logo">
            <a href="/">EwhaMarket</a>
        </div>
        <ul class="navbar__menu">
            <li><a href="/list">List</a></li>
            <li><a href="/review">Review</a></li>
            <li><a href="/reg_items">Register Items</a></li>
            <li><a href="/reg_reviews">Register Reviews</a></li>
        </ul>
    </nav>

    <section class="container">
        {% block section %}
        <h2>Welcome to EwhaMarket</h2>
        <p>Use the navigation links above to view products, reviews, or register items and reviews.</p>
        {% endblock section %}
    </section>

</body>
</html>
