{% extends "index.html" %}
{% block section %}

<h2>Write a Review</h2>

<form action="/submit_review_post" method="post" enctype="multipart/form-data" class="review-form">

    <label for="product_name">Product:</label>
    <input type="text" id="product_name" name="product_name" value="{{ name }}" required>

    <label for="title">Title:</label>
    <input type="text" id="title" name="title" required>

    <label for="review-body">Review:</label>
    <textarea id="review-body" name="body" rows="5" required></textarea>

    <p>Rating:</p>
    <div class="rating">
        <label><input type="radio" name="rating" value="1" required> 1</label>
        <label><input type="radio" name="rating" value="2"> 2</label>
        <label><input type="radio" name="rating" value="3"> 3</label>
        <label><input type="radio" name="rating" value="4"> 4</label>
        <label><input type="radio" name="rating" value="5"> 5</label>
    </div>

    <label for="photo">Photo:</label>
    <input type="file" id="photo" name="photo" accept="image/*" required>

    <button type="submit">Submit review</button>

</form>

{% endblock section %}
